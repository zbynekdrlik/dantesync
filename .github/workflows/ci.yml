name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Restrict permissions to minimum required
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Version Consistency Check
  # ============================================================================
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all tags for version check

      - name: Check version not already released
        run: |
          # Extract version from Cargo.toml
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"

          # Check if tag v$CARGO_VERSION already exists
          if git tag -l "v$CARGO_VERSION" | grep -q .; then
            echo "ERROR: Version v$CARGO_VERSION is already released!"
            echo "You must bump the version in Cargo.toml before merging."
            echo ""
            echo "Existing tags:"
            git tag -l 'v*' | tail -5
            exit 1
          fi

          echo "✓ Version v$CARGO_VERSION is new (not yet released)"

      - name: Check for hardcoded versions in scripts
        run: |
          # Extract version from Cargo.toml (single source of truth)
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"

          # Check that install.ps1 does NOT contain hardcoded app version patterns
          # (version should come from GitHub API, not hardcoded)
          # Allow: $NpcapVersion (dependency versions)
          # Forbid: $InstallerVersion, $AppVersion, $Version (app-level versions)
          if grep -E '\$(Installer|App)?Version\s*=\s*"[0-9]+\.[0-9]+' install.ps1; then
            echo "ERROR: install.ps1 contains hardcoded application version!"
            echo "Version must come from Cargo.toml via GitHub release API"
            exit 1
          fi

          # Check that uninstall.ps1 does NOT contain hardcoded app versions
          if grep -E '\$(Installer|App)?Version\s*=\s*"[0-9]+\.[0-9]+' uninstall.ps1; then
            echo "ERROR: uninstall.ps1 contains hardcoded version!"
            exit 1
          fi

          echo "✓ No hardcoded versions found in scripts"

  # ============================================================================
  # Formatting and Linting
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libpcap-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy -- -D warnings -A dead_code

  # ============================================================================
  # Tests
  # ============================================================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Note: Windows tests require WinPcap SDK setup - run in release workflow
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libpcap-dev

      - name: Run unit tests
        run: cargo test --lib --verbose

      - name: Run integration tests
        run: cargo test --test '*' --verbose
        timeout-minutes: 10

  # ============================================================================
  # Security Audit
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: |
          # Strict audit: fail on new advisories, but ignore known ones we've reviewed:
          # - RUSTSEC-2025-0134: rustls-pemfile unmaintained (transitive via reqwest, no direct impact)
          # - RUSTSEC-2024-0429: glib unsound VariantStrIter (transitive via tray-icon, we don't use this API)
          # - RUSTSEC-2022-0008: windows 0.24.0 delegate Send (transitive via winrt-notification, we don't use delegates)
          # GTK ecosystem advisories (all transitive via tray-icon, Linux tray support - we don't use affected APIs):
          # - RUSTSEC-2024-0413: atk unmaintained
          # - RUSTSEC-2024-0416: atk-sys unmaintained
          # - RUSTSEC-2024-0412: gdk unmaintained
          # - RUSTSEC-2024-0418: gdk-sys unmaintained
          # - RUSTSEC-2024-0415: gtk unmaintained
          # - RUSTSEC-2024-0420: gtk-sys unmaintained
          # - RUSTSEC-2024-0419: gtk3-macros unmaintained
          # - RUSTSEC-2024-0370: proc-macro-error unmaintained (transitive via gtk3-macros)
          # winit's Wayland/CSD backend advisories (#47 CI investigation, 2026-07-10) — chain is
          # winit -> sctk-adwaita -> smithay-client-toolkit/wayland-scanner -> quick-xml, and
          # winit -> sctk-adwaita -> ab_glyph -> owned_ttf_parser -> ttf-parser. `winit` itself is
          # a [target.'cfg(windows)'.dependencies] entry (dantesync-tray only); its Linux/Wayland
          # client-side-decoration backend is NEVER compiled into ANY shipped artifact — Windows
          # builds use winit's Win32 backend, and Linux CI only builds `--bin dantesync` (no
          # tray-icon/winit at all). cargo-audit still flags them because Cargo.lock resolves the
          # full cross-platform graph regardless of what actually compiles for a given target. No
          # semver-compatible fix available yet (`cargo update -p quick-xml`/`-p ttf-parser`:
          # 0 packages updated — wayland-scanner 0.31.10 is already latest and still pins
          # quick-xml <0.41). Re-check when wayland-scanner/winit bump their pin.
          # - RUSTSEC-2026-0194: quick-xml quadratic runtime on duplicate attrs (build-time-only
          #   parse of static, crate-bundled Wayland protocol XML — no runtime/untrusted input)
          # - RUSTSEC-2026-0195: quick-xml unbounded namespace-decl allocation (same build-time-only
          #   parse path as RUSTSEC-2026-0194)
          # - RUSTSEC-2026-0192: ttf-parser unmaintained (Wayland CSD title-bar glyph rendering,
          #   never compiled into a shipped binary — see chain above)
          cargo audit --deny warnings \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2024-0429 \
            --ignore RUSTSEC-2022-0008 \
            --ignore RUSTSEC-2024-0413 \
            --ignore RUSTSEC-2024-0416 \
            --ignore RUSTSEC-2024-0412 \
            --ignore RUSTSEC-2024-0418 \
            --ignore RUSTSEC-2024-0415 \
            --ignore RUSTSEC-2024-0420 \
            --ignore RUSTSEC-2024-0419 \
            --ignore RUSTSEC-2024-0370 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0192

  # ============================================================================
  # Build Check (ensures code compiles on all targets)
  #
  # #56: the Windows leg ALSO compiles the test binaries here via
  # `cargo test --no-run` (not just `cargo build`) -- previously the only
  # place Windows-only #[cfg(test)] code ever compiled was release.yml, i.e.
  # AFTER a PR already merged. A Windows-only test that stopped compiling
  # (dantesync#53/PR #55's NpcapPtpNetwork::pcap_ts_to_systemtime regression)
  # passed every PR gate and only broke at release time, publishing a
  # half-complete release (v1.8.22: Linux asset uploaded, Windows leg failed,
  # no .exe at all).
  #
  # `--no-run` (not a bare `cargo test`) is deliberate: it compiles+links
  # every test binary -- which is exactly what catches this class of bug --
  # without EXECUTING any of them. A bare `cargo test` was tried first and
  # hit a real `STATUS_DLL_NOT_FOUND` crash starting the produced test
  # binary in THIS job's environment (this job restores a cached `target/`
  # via actions/cache, which release.yml's job never does -- release.yml's
  # own `cargo test --verbose` step keeps working reliably, so the gap is
  # specific to this job's cache reuse, not Windows test execution in
  # general). Chasing that down further wasn't needed: the ticket's own
  # accepted minimum ("cargo test --no-run, or equivalent") is fully
  # sufficient for a compile-only regression class, and never touches the
  # runtime-DLL question at all -- see .claude/rules/windows-only-code.md.
  # ============================================================================
  build:
    name: Build Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libpcap-dev

      - name: Install Npcap SDK (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $expectedHash = "dad1f2bf1b02b787be08ca4862f99e39a876c1f274bac4ac0cedc9bbc58f94fd"
          Invoke-WebRequest -Uri https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile npcap-sdk.zip
          $actualHash = (Get-FileHash npcap-sdk.zip -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            Write-Error "Npcap SDK checksum mismatch! Expected: $expectedHash, Got: $actualHash"
            exit 1
          }
          Write-Host "Npcap SDK checksum verified: $actualHash"
          Expand-Archive npcap-sdk.zip -DestinationPath npcap-sdk
          echo "LIB=$PWD\npcap-sdk\Lib\x64;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile Tests (Windows) [#56 -- closes the PR-time blind spot]
        if: runner.os == 'Windows'
        run: cargo test --no-run --verbose

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release --bin dantesync --bin dantesync-tray --target ${{ matrix.target }}

  # ============================================================================
  # Code Coverage
  # ============================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgtk-3-dev libpcap-dev

      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage
        run: cargo tarpaulin --out xml --output-dir coverage --verbose

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cobertura.xml
          fail_ci_if_error: true

  # ============================================================================
  # Auto-Release (creates tag after successful CI on master)
  # ============================================================================
  auto-release:
    name: Auto Release
    runs-on: ubuntu-latest
    needs: [version-check, lint, test, security, build, coverage]
    # Only run on push to master, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version and create tag
        run: |
          # Extract version from Cargo.toml
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG="v$VERSION"
          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

          # Check if tag already exists (should not, version-check validates this)
          if git tag -l "$TAG" | grep -q .; then
            echo "Tag $TAG already exists, skipping release"
            echo "SKIP_RELEASE=true" >> $GITHUB_ENV
            exit 0
          fi

          # Configure git for tagging
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create and push tag
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "✓ Created and pushed tag $TAG"

      - name: Trigger release workflow
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering release workflow for $TAG"
          gh workflow run release.yml -f tag="$TAG"
          echo "✓ Release workflow triggered for $TAG"
